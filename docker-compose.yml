services:
  smart-proxy:
    image: smart-proxy:latest
    container_name: smart-proxy
    restart: unless-stopped
    network_mode: host
    environment:
      PORTAINER_API_KEY: "${PORTAINER_API_KEY}"
      ZAI_API_KEY: "${ZAI_API_KEY}"
      SMART_PROXY_CONFIG: "/opt/smart-proxy/config.yaml"
    volumes:
      - ~/llm-hosts/smart-proxy/config.yaml:/opt/smart-proxy/config.yaml:ro
      - ~/llm-hosts/smart-proxy/state.json:/opt/smart-proxy/state.json
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    mem_limit: 512m
    cpus: "2"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    mem_limit: 8g
    cpus: "4"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  qdrant-data:
