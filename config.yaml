listen_port: 4000

portainer:
  url: "https://localhost:9443"
  api_key_env: "PORTAINER_API_KEY"
  endpoint_id: 3
  verify_ssl: false

backends:
  inference:
    url: "http://localhost:8080"
    health: "/health"
  embedding:
    url: "http://localhost:8090"
    health: "/health"
  remote_coder:
    url: "http://coder-host.lan:1234"
    health: "/v1/models"
  classifier:
    url: "http://localhost:8091"
    health: "/health"
  helper:
    url: "http://localhost:8092"
    health: "/health"
  zai:
    url: "https://api.z.ai/api/anthropic"
    api_key_env: "ZAI_API_KEY"

models:
  qwen35-q8:
    stack_name: "qwen35-opus-q8"
    aliases: ["reasoning", "precise", "quality"]
    description: "Qwen3.5-27B Opus-distilled Q8_0 — max quality, 16k ctx"
    gpu_model: true
    thinking: false

  qwen35-q6:
    stack_name: "qwen35-opus-q6"
    aliases: ["longctx", "deep-reason", "research"]
    description: "Qwen3.5-27B Opus-distilled Q6_K — long context, 49k ctx"
    gpu_model: true
    thinking: true

  qwen3-80b:
    stack_name: "qwen3-next-instruct"
    aliases: ["workhorse", "general", "execute"]
    description: "Qwen3-Next-80B-A3B Q3_K_M — heads-down execution"
    gpu_model: true
    thinking: false

  qwen3-coder:
    stack_name: "qwen3-a3b"
    aliases: ["coder", "code", "dev"]
    description: "Qwen3-Coder-Next Q3_K_M — coding specialist"
    gpu_model: true
    thinking: false

  gemma4-moe:
    stack_name: "gemma4-moe-q8"
    aliases: ["gemma", "gemma4", "gemma-moe"]
    description: "Gemma 4 26B-A4B MoE Q8_0 — fast reasoning, 64k ctx, 41 t/s"
    gpu_model: true
    thinking: true

  qwen36-moe:
    stack_name: "qwen36-moe-q5"
    aliases: ["qwen36", "qwen3.6", "qwen-moe", "next"]
    description: "Qwen3.6-35B-A3B MoE Q5_K_M — vision-capable workhorse, 64k ctx"
    gpu_model: true
    thinking: true

  qwen36-dense:
    stack_name: "qwen36-dense-q6"
    aliases: ["qwen36-dense", "qwen3.6-dense"]
    description: "Qwen3.6-27B dense Q6_K — vision, 64k ctx"
    gpu_model: true
    thinking: true

  qwen38-dense:
    stack_name: "qwen38-dense-q6"
    aliases: ["qwen38", "qwen3.8", "qwen38-dense", "dense", "quality"]
    description: "Qwen3.8-27B dense Q6_K — vision, 262k ctx, 4 parallel slots, ~8.5 t/s single / ~15 t/s concurrent"
    gpu_model: true
    thinking: true

  classifier:
    backend: "classifier"
    aliases: ["classify", "triage", "quick"]
    always_available: true
    description: "Qwen3-4B-Instruct-2507 Q4_K_M — classification + triage, always-on"

  helper:
    backend: "helper"
    aliases: ["helper", "rag", "summarize", "quick-answer"]
    always_available: true
    description: "Qwen3-4B Q4_K_M — summarization, RAG, quality gate fallback"

  nomic-embed:
    backend: "embedding"
    aliases: ["embed", "nomic-embed-text"]
    always_available: true

  remote-coder:
    backend: "remote_coder"
    aliases: ["remote", "lmstudio"]
    always_available: true

  auto-route:
    aliases: ["auto", "smart"]
    always_available: true
    description: "Auto-routes via classifier to optimal tier (helper/GPU/coder)"

  glm-4.6v:
    backend: "zai"
    upstream_model: "glm-5.3-flash"
    aliases: ["glm-4-6v", "glm46v"]
    always_available: true
    quality_gate: true
    concurrency_limit: 10
    frontier_fallback: "glm-4.7"
    local_fallback: true
    description: "Z.AI GLM-4.6V (vision) via quality gate — still accepted on coding plan (verified usage 2026-09); glm-5.3-flash is the newer multimodal option"

  glm-4.7:
    backend: "zai"
    upstream_model: "glm-5.3-flash"
    aliases: ["glm-4-7", "glm47"]
    always_available: true
    quality_gate: true
    concurrency_limit: 4
    frontier_fallback: "glm-4.7-flash"
    local_fallback: true
    description: "Z.AI GLM-4.7 via quality gate — proxy reroutes to glm-5.3-flash (UPSTREAM_ROUTES enforced proxy-side 2026-09-04; flash credit pricing; was server-side auto-route). Kept for client compat. 4 concurrent recorded worst-observed 2026-09-02; after reroute glm-5.3-flash cap 5 applies"

  glm-4.7-flash:
    backend: "zai"
    upstream_model: "glm-5.3-flash"
    aliases: ["glm-4-7-flash", "glm47flash"]
    always_available: true
    quality_gate: true
    concurrency_limit: 1
    local_fallback: true
    description: "Z.AI GLM-4.7-Flash via quality gate — legacy cheap tier, proxy reroutes to glm-5.3-flash (UPSTREAM_ROUTES enforced proxy-side 2026-09-04; was server-side redirect). No frontier fallback (was glm-4.5-air, purged 2026-09); local GPU catches. 529 overloaded_error upstream on 2026-09-02 predates the reroute"

  glm-5.2:
    backend: "zai"
    upstream_model: "glm-5.3"
    aliases: ["glm5.2", "glm52"]
    always_available: true
    quality_gate: true
    concurrency_limit: 4
    frontier_fallback: "glm-4.7"
    local_fallback: true
    description: "Z.AI GLM-5.2 via quality gate — explicit-only legacy access; proxy reroutes to glm-5.3 (UPSTREAM_ROUTES enforced proxy-side 2026-09-04; was server-side auto-route). Superseded as flagship by glm-5.3 (2026-08-18). 4 concurrent recorded worst-observed 2026-09-02; after reroute glm-5.3 cap 6 applies"

  glm-5.3:
    backend: "zai"
    aliases: ["glm5", "glm-5", "glm5.3", "glm53"]
    always_available: true
    quality_gate: true
    concurrency_limit: 6
    frontier_fallback: "glm-5.3-flash"
    local_fallback: true
    description: "Z.AI GLM-5.3 via quality gate — flagship (released 2026-08-18), text-only, forced thinking (reasoning_effort low/high/max, default max), 128K max output. Falls back to glm-5.3-flash (3x cheaper credits). Plain id = standard context; upstream [1m] suffix unlocks 1M (not exposed — long-context quality suspect). 6 concurrent — conservative worst-observed admission under real-payload stress (burst of 8 admitted 6; 6 sustained 13/13 clean; upstream limiter is DYNAMIC, varies by load window; 2026-09-02/03)"

  glm-5.3-flash:
    backend: "zai"
    aliases: ["glm53flash", "glm5.3-flash", "glm-53-flash"]
    always_available: true
    quality_gate: true
    concurrency_limit: 5
    local_fallback: true
    description: "Z.AI GLM-5.3-Flash via quality gate — multimodal (vision) workhorse, 320B/18B hybrid attention, ~1/3 credit cost of glm-5.3 (3x quota). Successor to glm-4.7 and glm-4.6v roles. Text-only output, 128K max. Cheapest Z.AI tier — no frontier fallback; local GPU catches. 5 concurrent — conservative worst-observed (morning window 429'd at 6; evening window admitted 8/8 real payloads; upstream limiter is DYNAMIC; verified 2026-09-02/03)"

  glm-5-turbo:
    backend: "zai"
    upstream_model: "glm-5.3-flash"
    aliases: ["glm5-turbo"]
    always_available: true
    quality_gate: true
    concurrency_limit: 8
    frontier_fallback: "glm-4.7"
    local_fallback: true
    description: "Z.AI GLM-5-Turbo via quality gate — dropped from Z.AI docs but still accepted + billed on plan (verified usage 2026-09). Z.AI began answering glm-5-turbo with glm-5.3-flash responses 2026-09-04 (3/3 verified), so the proxy reroutes it onto the flash pool (UPSTREAM_ROUTES enforced proxy-side 2026-09-04) — no longer a distinct concurrency pool; effective cap = glm-5.3-flash cap 5. 8 concurrent recorded 2026-09-03 (8/8 burst clean, 6 sustained 9/9 clean, 429s at 12) remains passthrough defense only"

# Local GPU fallback pin (binding decision 2026-09-03): quality_gate local
# fallback ALWAYS targets this model — never the active-stack model. The
# fallback is skipped (logged) unless this model's stack is the active one.
local_fallback_model: "qwen38-dense"

swap:
  cooldown_seconds: 600
  health_timeout_seconds: 120
  state_file: "/opt/smart-proxy/state.json"

default_model: "qwen35-q8"
